services:
  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: test-root-only
      MYSQL_DATABASE: colors_test
      MYSQL_USER: colors_test
      MYSQL_PASSWORD: test-only
    volumes:
      - ../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 60
  web:
    build:
      context: ..
      dockerfile: tests/php.Dockerfile
    ports:
      - "127.0.0.1::8080"
    volumes:
      - ../api:/app/api:ro
      - ../config:/app/config:ro
      - ../public:/app/public:ro
      - .:/app/tests:ro
      - ./app.env:/app/.env:ro
    depends_on:
      database:
        condition: service_healthy
